name: packshots
on:
  workflow_dispatch:
    inputs:
      list:
        description: "Path to a JSON {name: url} file under data/packshots"
        required: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pack shots
        run: |
          dir=$(dirname "${{ inputs.list }}")
          python3 - "${{ inputs.list }}" "$dir" <<'P'
          import json,sys,urllib.request,os
          lst,d=sys.argv[1],sys.argv[2]
          for k,u in json.load(open(lst)).items():
              ext=os.path.splitext(u.split('?')[0])[1] or '.jpg'
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
              open(os.path.join(d,k+ext),'wb').write(urllib.request.urlopen(req,timeout=30).read())
              print('ok',k)
          P
      - name: Commit
        run: |
          git config user.name "shelf-architect-runner"; git config user.email "runner@users.noreply.github.com"
          git add data/packshots && git commit -m "packshots: run ${{ github.run_id }}" || exit 0
          git pull --rebase -q origin main && git push -q
